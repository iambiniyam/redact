[project]
name = "redact-local"
version = "0.1.0"
description = "Offline PII redaction for PDFs and images. Share the document, not your data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Biniyam Gashaw" }]
keywords = ["privacy", "pii", "redaction", "ocr", "offline", "pdf", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "pymupdf>=1.24",
  "pillow>=10.4",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "rapidocr-onnxruntime>=1.4",
  "typer>=0.12",
  "rich>=13.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx2"]
ner = ["spacy>=3.8"]

[project.scripts]
redact = "redact.cli:app"

[project.urls]
Homepage = "https://github.com/iambiniyam/redact"
Repository = "https://github.com/iambiniyam/redact"
Issues = "https://github.com/iambiniyam/redact/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
